<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="The DevMarq" />
  <meta name="description" content="Explore The DevMarq brochure — a creative & digital growth support agency helping brands and individuals with design, marketing, and tech solutions." />
  <meta name="keywords" content="The DevMarq, digital marketing, creative agency, social media, brochure, branding, website development" />
  <title>The DevMarq Brochure</title>

  <style>
    body {
      margin: 0;
      background: #333;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Trebuchet MS", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    h1 {
      margin: 20px;
      font-size: 24px;
      background: #1a1a1a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      border: ridge 2px #fff;
    }

    @media (min-width: 1024px) {
      h1 { font-size: 32px; }
    }

    .image-container {
      position: relative;
      width: 100vw;
      max-width: 1200px;
      height: 80vh;
      overflow: hidden;
      border-radius: 12px;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: blur(8px);
      transition: filter 0.4s ease;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.5);
    }

    .overlay button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #ECD868;
      color: #1a1a1a;
      transition: all 0.3s ease;
    }

    .overlay button:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <h1>📄 The <span style="color:#ECD868;">DevMarq</span> Brochure</h1>

  <div class="image-container">
    <img 
      src="https://cdn.jsdelivr.net/gh/TheDevMarq/The-DevMarq-Assets@main/brochure/The_Devmarq_Brochure.webp"
      alt="The DevMarq Brochure Preview"
      loading="lazy"
    >
    <div class="overlay">
      <button onclick="openImage()">Open Full Image</button>
    </div>
  </div>

  <script>
    function openImage() {
      window.open(
        'https://cdn.jsdelivr.net/gh/TheDevMarq/The-DevMarq-Assets@main/brochure/The_Devmarq_Brochure.webp',
        '_blank'
      );
    }
  </script>

</body>
</html>
